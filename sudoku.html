<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sudoku.css">
</head>
<body>
  <main class="app">
    <section class="game-card" aria-labelledby="game-title">
      <div class="hero">
        <a href="index.html" class="back-link">Back to Games</a>
        <h1 id="game-title">Sudoku</h1>
        <p class="subtitle">Fill the grid so that every row, column, and 3x3 box contains the digits 1 through 9.</p>
      </div>

      <div id="sudoku-board" class="board"></div>

      <div id="number-palette"></div>

      <div class="controls">
        <button id="new-game-btn" class="restart" type="button">New Game</button>
        <button id="check-btn" class="" type="button">Check Solution</button>
      </div>
    </section>
  </main>

  <script src="sudoku.js"></script>
</body>
</html>
