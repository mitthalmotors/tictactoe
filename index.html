<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Selection</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="game-card" aria-labelledby="game-selection-title">
      <div class="hero">
        <h1 id="game-selection-title">Select a Game</h1>
        <p class="subtitle">Choose your adventure!</p>
      </div>

      <div class="game-list">
        <a href="tictactoe.html" class="game-link">
          <h2>Tic-Tac-Toe</h2>
          <p>Play the classic 3x3 grid game.</p>
        </a>
        <a href="tetris.html" class="game-link">
          <h2>Tetris</h2>
          <p>Drop falling blocks and clear lines.</p>
        </a>
      </div>
    </section>
  </main>
