<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #38bdf8;
      --danger: #f59e0b;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      padding: 24px;
    }

    .app {
      width: min(100%, 420px);
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 24px;
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status {
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--panel-2);
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      border: none;
      border-radius: 16px;
      background: #0b1220;
      color: var(--text);
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .cell:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #162033;
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.x {
      color: var(--accent-2);
    }

    .cell.o {
      color: var(--accent);
    }

    .cell.win {
      background: rgba(245, 158, 11, 0.16);
      box-shadow: inset 0 0 0 2px rgba(245, 158, 11, 0.7);
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    button.reset {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      background: linear-gradient(135deg, var(--accent-2), #6366f1);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button.reset:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .legend {
      width: 100%;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Tic Tac Toe</h1>
    <p class="subtitle">A simple two-player game for X and O</p>

    <div class="status" id="status" aria-live="polite">Player X's turn</div>

    <section class="board" id="board" aria-label="Tic Tac Toe board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </section>

    <div class="controls">
      <button class="reset" id="resetBtn">New Game</button>
      <div class="legend">Click any square to make your move.</div>
    </div>
  </main>

  <script>
    const cells = Array.from(document.querySelectorAll('.cell'));
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');

    const winningCombos = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameActive = true;

    function updateStatus(message) {
      statusEl.textContent = message;
    }

    function checkWinner() {
      for (const combo of winningCombos) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return combo;
        }
      }
      return null;
    }

    function handleCellClick(event) {
      const cell = event.currentTarget;
      const index = Number(cell.dataset.index);

      if (!gameActive || board[index]) {
        return;
      }

      board[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer.toLowerCase());
      cell.disabled = true;

      const winningCombo = checkWinner();
      if (winningCombo) {
        gameActive = false;
        winningCombo.forEach(i => cells[i].classList.add('win'));
        cells.forEach(c => c.disabled = true);
        updateStatus('Player ' + currentPlayer + ' wins!');
        return;
      }

      if (board.every(value => value !== '')) {
        gameActive = false;
        updateStatus("It's a draw!");
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus('Player ' + currentPlayer + "'s turn");
    }

    function resetGame() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameActive = true;

      cells.forEach(cell => {
        cell.textContent = '';
        cell.disabled = false;
        cell.className = 'cell';
      });

      updateStatus("Player X's turn");
    }

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    resetBtn.addEventListener('click', resetGame);
  </script>
</body>
</html>
