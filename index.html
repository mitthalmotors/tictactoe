<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="game-card" aria-labelledby="game-title">
      <div class="hero">
        <p class="eyebrow">Single-player mode</p>
        <h1 id="game-title">Tic-Tac-Toe</h1>
        <p class="subtitle">Play as ❌ against the computer and race to three in a row.</p>
      </div>

      <section class="info-panel" aria-label="Game information">
        <div class="status-block">
          <p class="label">Game status</p>
          <p id="status" class="status" aria-live="polite">Your turn</p>
        </div>

        <div class="meta-row">
          <div class="meta-chip" aria-live="polite">
            <span class="label">Mode</span>
            <strong id="mode-indicator">Human vs Computer</strong>
          </div>
          <div class="meta-chip" aria-live="polite">
            <span class="label">Turn</span>
            <strong id="turn-indicator">Player ❌</strong>
          </div>
        </div>
      </section>

      <div id="board" class="board" role="grid" aria-label="Tic-Tac-Toe board">
        <button class="cell" type="button" data-cell-index="0" aria-label="Cell 1"></button>
        <button class="cell" type="button" data-cell-index="1" aria-label="Cell 2"></button>
        <button class="cell" type="button" data-cell-index="2" aria-label="Cell 3"></button>
        <button class="cell" type="button" data-cell-index="3" aria-label="Cell 4"></button>
        <button class="cell" type="button" data-cell-index="4" aria-label="Cell 5"></button>
        <button class="cell" type="button" data-cell-index="5" aria-label="Cell 6"></button>
        <button class="cell" type="button" data-cell-index="6" aria-label="Cell 7"></button>
        <button class="cell" type="button" data-cell-index="7" aria-label="Cell 8"></button>
        <button class="cell" type="button" data-cell-index="8" aria-label="Cell 9"></button>
      </div>

      <div class="controls">
        <button id="restart" class="restart" type="button">Restart Game</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
<script src="3d_ui.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Create the scene, camera, and renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({
      canvas: document.createElement('canvas'),
      antialias: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    // Add some basic lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 1, 100);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);
    // Add a cube to the scene
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);
    camera.position.z = 5;
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
