<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="game-shell" aria-label="Tic-Tac-Toe game">
        <div class="hero">
          <span class="eyebrow">Single Player</span>
          <h1>Tic-Tac-Toe</h1>
          <p class="subtitle">Challenge the computer in a smooth, animated neon arena.</p>
        </div>

        <div class="status-bar" aria-live="polite">
          <div class="status-pill">
            <span class="status-label">Status</span>
            <span class="status-text">Your turn</span>
          </div>
          <button class="reset" type="button">Reset Game</button>
        </div>

        <section class="board" aria-label="Tic-Tac-Toe board">
          <button class="cell" type="button" aria-label="Cell 1"><span></span></button>
          <button class="cell" type="button" aria-label="Cell 2"><span></span></button>
          <button class="cell" type="button" aria-label="Cell 3"><span></span></button>
          <button class="cell" type="button" aria-label="Cell 4"><span></span></button>
          <button class="cell" type="button" aria-label="Cell 5"><span></span></button>
          <button class="cell" type="button" aria-label="Cell 6"><span></span></button>
          <button class="cell" type="button" aria-label="Cell 7"><span></span></button>
          <button class="cell" type="button" aria-label="Cell 8"><span></span></button>
          <button class="cell" type="button" aria-label="Cell 9"><span></span></button>
        </section>

        <div class="legend" aria-hidden="true">
          <div class="legend-item"><span class="legend-mark player-x">X</span><span>You</span></div>
          <div class="legend-item"><span class="legend-mark player-o">O</span><span>Computer</span></div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
