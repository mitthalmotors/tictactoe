<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Selection</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Select a Game</h1>
    <div class="game-selection">
      <a href="tictactoe.html" class="game-card">
        <img src="images/tictactoe_thumbnail.png" alt="Tic-Tac-Toe" class="game-card-image">
        <div class="game-card-content">
          <h2>Tic-Tac-Toe</h2>
          <p>A classic two-player game on a 3x3 grid.</p>
        </div>
      </a>
      <a href="tetris.html" class="game-card">
        <img src="images/tetris_thumbnail.png" alt="Tetris" class="game-card-image">
        <div class="game-card-content">
          <h2>Tetris</h2>
          <p>The iconic puzzle game where you fit falling blocks.</p>
        </div>
      </a>
      <a href="sudoku.html" class="game-card">
        <img src="images/sudoku_thumbnail.png" alt="Sudoku" class="game-card-image">
        <div class="game-card-content">
          <h2>Sudoku</h2>
          <p>A logic-based number-placement puzzle.</p>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
